{% extends "base.html" %}
{% load static %}

{% block title %}Log in{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'form.css' %}" />
{% endblock %}

{% block main %}
<form method="POST">
  {% csrf_token %}
  <h2>Log in to Forumownik</h2>
  <div class="form">
    {{ form }}
  </div>
  <button type="submit">Log in</button>
</form>
{% endblock %}
