[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
nodaemon=true
user=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:django]
command=/usr/sbin/uwsgi --ini /etc/uwsgi.ini
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
