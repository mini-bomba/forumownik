upstream django {
  server unix:///tmp/uwsgi.sock;
}

error_log /dev/stdout;
access_log off;

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  client_max_body_size 15M;

  location /static {
    alias /app/static;
  }

  location / {
    uwsgi_pass django;
    include /etc/nginx/uwsgi_params;
  }
}
