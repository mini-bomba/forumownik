version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: "/.github/workflows"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
