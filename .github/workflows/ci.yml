name: CI/CD

on:
  push:

permissions:
  actions: read
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Perform the checks
        env:
          ENVFILE: ${{ secrets.ENVFILE }}
        run: |
          # create envfile
          echo "$ENVFILE" > .env
          # install deps
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          # check for migrations
          ./manage.py check forumownik
          ./manage.py makemigrations --check forumownik

  build-docker:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Attempt to build the image
        run: |
          docker build -t ghcr.io/mini-bomba/forumownik:latest .
          docker image save ghcr.io/mini-bomba/forumownik:latest | zstd > docker-image.tar.zst

      - name: Quick image test
        env:
          ENVFILE: ${{ secrets.ENVFILE }}
        run: |
          # create envfile
          echo "$ENVFILE" > .env
          # start from compose
          docker compose -f prod-compose.yml up -d
          # let it spin up
          sleep 5
          # check status
          FAILS=0
          while true
          do
            # if there's at least one app container and no unhealthy ones
            if [[ "`docker ps -a --filter "name=forumownik-app" | wc -l`" -gt 1 && "`docker ps -a --filter "name=forumownik-app" | grep -v "healthy" | wc -l`" -eq 1 ]]
            then
              break
            fi
            FAILS=$(($FAILS + 1))
            if [[ "$FAILS" -ge 5 ]]
            then
              exit 1
            fi
            sleep 5
          done

      - name: Upload image as artifact
        uses: actions/upload-artifact@v7
        id: upload
        with:
          name: docker-image
          path: docker-image.tar.zst
          if-no-files-found: error
          archive: false
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}

  publish:
    runs-on: ubuntu-latest
    needs: [checks, build-docker]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      packages: write
    steps:
      - name: Download the docker image
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-docker.outputs.artifact }}
          skip-decompress: true
      - name: Authenticate with ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$USER" --password-stdin
      - name: Import image and publish
        run: |
          docker image load -i docker-image.tar.zst
          docker image push ghcr.io/mini-bomba/forumownik:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Send push event to webhook (with HMAC SHA256 signature)
        env:
          WEBHOOK_URL: ${{ secrets.DOCO_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DOCO_WEBHOOK_SECRET }}
        run: |
          CLONE_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          PAYLOAD=$(jq -n \
            --arg ref "${GITHUB_REF}" \
            --arg before "${GITHUB_SHA}" \
            --arg after "${GITHUB_SHA}" \
            --arg clone_url "$CLONE_URL" \
            --arg reponame "${GITHUB_REPOSITORY##*/}" \
            --arg repo_fullname "${GITHUB_REPOSITORY}" \
            --arg pusher_name "${GITHUB_ACTOR}" \
            --arg pusher_email "noreply@github.com" \
            '{
              ref: $ref,
              before: $before,
              after: $after,
              repository: {
                name: $reponame,
                full_name: $repo_fullname,
                clone_url: $clone_url
              },
              pusher: {
                name: $pusher_name,
                email: $pusher_email
              }
            }'
          )

          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"

          curl -v -X POST "$WEBHOOK_URL" \
            --fail-with-body \
            --no-progress-meter \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD"
