name: CI/CD

on:
  push:

permissions:
  actions: read
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Perform the checks
        env:
          ENVFILE: ${{ secrets.ENVFILE }}
        run: |
          # create envfile
          echo "$ENVFILE" > .env
          # install deps
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          # check for migrations
          ./manage.py check forumownik
          ./manage.py makemigrations --check forumownik

  build-docker:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Attempt to build the image
        run: |
          docker build -t ghcr.io/mini-bomba/forumownik:latest .
          docker image save ghcr.io/mini-bomba/forumownik:latest | zstd > docker-image.tar.zst

      - name: Quick image test
        env:
          ENVFILE: ${{ secrets.ENVFILE }}
        run: |
          # create envfile
          echo "$ENVFILE" > .env
          # start from compose
          docker compose -f prod-compose.yml up -d
          # let it spin up
          sleep 5
          # check status
          FAILS=0
          while true
          do
            # if there's at least one app container and no unhealthy ones
            if [[ "`docker ps -a --filter "name=forumownik-app" | wc -l`" -gt 1 && "`docker ps -a --filter "name=forumownik-app" | grep -v "healthy" | wc -l`" -eq 1 ]]
            then
              break
            fi
            FAILS=$(($FAILS + 1))
            if [[ "$FAILS" -ge 5 ]]
            then
              exit 1
            fi
            sleep 5
          done

      - name: Upload image as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: docker-image
          path: docker-image.tar.zst
          if-no-files-found: error
          archive: false
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}

  semgrep:
    name: "SAST: semgrep"
    runs-on: ubuntu-latest
    steps:
      - name: Install semgrep
        run: pip install semgrep
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Semgrep scan
        run: semgrep --config auto --error .

  trivy:
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - name: Download trivy
        run: |
          curl -Lo trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf trivy.tar.gz" | sha256sum -c -
          tar -xf trivy.tar.gz

      - name: Download the docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-docker.outputs.artifact }}
          skip-decompress: true

      - name: Scan image with trivy
        run: |
          zstd -d docker-image.tar.zst
          ./trivy image --severity HIGH,CRITICAL ghcr.io/mini-bomba/forumownik:latest --format json -o trivy.json --input docker-image.tar
          # spam out warnings
          jq -r '.Results.[].Vulnerabilities | select(. != null) | flatten | map("::warning::" + .Severity + ", " + .PkgID + ": " + .Title + " (fixed in " + .FixedVersion + ")").[]' trivy.json

      - name: Upload scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: trivy-results
          path: trivy.json
          if-no-files-found: error
          archive: false

  gitleaks:
    name: "Secret scanning: gitleaks"
    runs-on: ubuntu-latest
    steps:
      - name: Install gitleaks
        run: |
          curl -Lo /tmp/gitleaks.zip https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb /tmp/gitleaks.zip" | sha256sum -c -
          tar -C /tmp -xf /tmp/gitleaks.zip gitleaks
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: gitleaks scan
        run: /tmp/gitleaks dir -v --config .github/gitleaks.toml .

  nikto:
    name: "DAST: nikto"
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Download the docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-docker.outputs.artifact }}
          skip-decompress: true

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: forumownik

      - name: Import docker image
        run: docker image load -i docker-image.tar.zst

      - name: Start the app
        working-directory: forumownik
        env:
          ENVFILE: ${{ secrets.ENVFILE }}
        run: |
          # create envfile
          echo "$ENVFILE" > .env
          # start from compose
          docker compose -f prod-compose.yml up -d
          # let it spin up
          sleep 5
          # check status
          FAILS=0
          while true
          do
            # if there's at least one app container and no unhealthy ones
            if [[ "`docker ps -a --filter "name=forumownik-app" | wc -l`" -gt 1 && "`docker ps -a --filter "name=forumownik-app" | grep -v "healthy" | wc -l`" -eq 1 ]]
            then
              break
            fi
            FAILS=$(($FAILS + 1))
            if [[ "$FAILS" -ge 5 ]]
            then
              exit 1
            fi
            sleep 5
          done

      - name: Run nikto
        run: |
          mkdir output
          chmod 1777 output
          docker run \
            --rm \
            -h nikto \
            --name nikto \
            --network forumownik_default \
            -v $PWD/output:/output \
            ghcr.io/sullo/nikto:latest \
            -h http://app:80 \
            -o /output/nikto.json \
            -Tuning x567

      - name: Upload scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nikto-results
          path: output/nikto.json
          if-no-files-found: error
          archive: false

  publish:
    runs-on: ubuntu-latest
    needs: [checks, build-docker, trivy, semgrep, gitleaks, nikto]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      packages: write
    steps:
      - name: Download the docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-docker.outputs.artifact }}
          skip-decompress: true
      - name: Authenticate with ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$USER" --password-stdin

      - name: Install cosign
        run: sudo apt install cosign

      - name: Import image and publish
        env:
          SHA: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/mini-bomba/forumownik
          SIGSTORE_ID_TOKEN: ${{ github.token }}
        run: |
          docker image load -i docker-image.tar.zst
          docker image tag $IMAGE_NAME:latest $IMAGE_NAME:$SHA
          docker image push $IMAGE_NAME:latest
          docker image push $IMAGE_NAME:$SHA
          cosign sign $IMAGE_NAME:latest
          cosign sign $IMAGE_NAME:$SHA

  deploy:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Send push event to webhook (with HMAC SHA256 signature)
        env:
          WEBHOOK_URL: ${{ secrets.DOCO_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DOCO_WEBHOOK_SECRET }}
        run: |
          CLONE_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          PAYLOAD=$(jq -n \
            --arg ref "${GITHUB_REF}" \
            --arg before "${GITHUB_SHA}" \
            --arg after "${GITHUB_SHA}" \
            --arg clone_url "$CLONE_URL" \
            --arg reponame "${GITHUB_REPOSITORY##*/}" \
            --arg repo_fullname "${GITHUB_REPOSITORY}" \
            --arg pusher_name "${GITHUB_ACTOR}" \
            --arg pusher_email "noreply@github.com" \
            '{
              ref: $ref,
              before: $before,
              after: $after,
              repository: {
                name: $reponame,
                full_name: $repo_fullname,
                clone_url: $clone_url
              },
              pusher: {
                name: $pusher_name,
                email: $pusher_email
              }
            }'
          )

          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"

          curl -v -X POST "$WEBHOOK_URL" \
            --fail-with-body \
            --no-progress-meter \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD"
